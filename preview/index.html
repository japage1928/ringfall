<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ringfall sprite preview</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #12140f; color: #e7e2d4; font-family: "Segoe UI", sans-serif; }
    body { display: flex; flex-direction: column; min-height: 100%; }
    header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 12px 16px; background: #1c2118; }
    h1 { font-size: 16px; margin: 0; letter-spacing: 0.04em; }
    p { margin: 0; font-size: 13px; color: #b7b39a; }
    button { background: #3d4a28; color: #f3f0e4; border: 1px solid #6d7a45; padding: 6px 12px; cursor: pointer; font: inherit; }
    button[aria-pressed="true"] { background: #6d7a32; }
    output { font-size: 12px; color: #8d927c; }
    main { flex: 1; display: grid; place-items: center; padding: 12px; }
    canvas { width: min(100%, 1280px); height: auto; background: #000; image-rendering: pixelated; image-rendering: crisp-edges; }
  </style>
</head>
<body>
  <header>
    <h1>Ringfall</h1>
    <p id="hint">Outpost camp. Arrows or A/D walk the soldier. The fortress alien patrols the bridge.</p>
    <output id="pos"></output>
    <button type="button" id="btn-outpost" aria-pressed="true">Outpost</button>
    <button type="button" id="btn-fortress" aria-pressed="false">Fortress</button>
  </header>
  <main>
    <canvas id="view" width="1280" height="720"></canvas>
  </main>
  <script>
    const canvas = document.getElementById("view");
    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = false;
    const hint = document.getElementById("hint");
    const buttons = {
      outpost: document.getElementById("btn-outpost"),
      fortress: document.getElementById("btn-fortress"),
    };

    const keys = new Set();
    let scene = "outpost";
    let layout = null;
    const images = {};
    let soldierX = 520;
    let soldierFacing = 1;
    let soldierWalk = 0;
    let alienX = 640;
    let alienDir = 1;
    let alienWalk = 0;
    let last = performance.now();
    const params = new URLSearchParams(location.search);
    if (params.get("scene") === "fortress") scene = "fortress";
    const autowalk = params.get("autowalk") === "1";

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error(src));
        img.src = src;
      });
    }

    function drawSprite(img, cx, feet, facing) {
      const y = feet - img.height;
      ctx.save();
      ctx.translate(Math.round(cx), Math.round(y));
      ctx.scale(facing, 1);
      ctx.drawImage(img, Math.round(-img.width / 2), 0);
      ctx.restore();
    }

    function setScene(name) {
      scene = name;
      buttons.outpost.setAttribute("aria-pressed", name === "outpost" ? "true" : "false");
      buttons.fortress.setAttribute("aria-pressed", name === "fortress" ? "true" : "false");
      hint.textContent = name === "outpost"
        ? "Outpost camp. Arrows or A/D walk the soldier along the dirt."
        : "Alien fortress. The spear alien patrols the bridge. Arrows still walk the outpost soldier.";
    }

    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      const soldier = layout.outpost.soldier;
      const alien = layout.fortress.alien;
      let moving = keys.has("arrowleft") || keys.has("a") || keys.has("arrowright") || keys.has("d") || autowalk;
      if (autowalk) soldierFacing = 1;
      else if (keys.has("arrowleft") || keys.has("a")) soldierFacing = -1;
      else if (keys.has("arrowright") || keys.has("d")) soldierFacing = 1;
      if (moving && scene === "outpost") {
        const dir = autowalk ? 1 : soldierFacing;
        soldierX = Math.max(soldier.minX, Math.min(soldier.maxX, soldierX + dir * 180 * dt));
        soldierWalk += dt;
      }
      alienX += alienDir * 70 * dt;
      alienWalk += dt;
      if (alienX > alien.maxX) { alienX = alien.maxX; alienDir = -1; }
      if (alienX < alien.minX) { alienX = alien.minX; alienDir = 1; }

      ctx.imageSmoothingEnabled = false;
      const bg = images[scene === "outpost" ? "outpost-bg" : "fortress-bg"];
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(bg, 0, 0);
      if (scene === "outpost") {
        const walking = moving && scene === "outpost";
        const frameImg = walking && Math.floor(soldierWalk * 6) % 2 === 1 ? images.soldierWalk : images.soldierIdle;
        drawSprite(frameImg, soldierX, soldier.feet, soldierFacing);
      } else {
        const frameImg = Math.floor(alienWalk * 4) % 2 === 1 ? images.alienWalk : images.alienIdle;
        drawSprite(frameImg, alienX, alien.feet, alienDir);
      }
      document.getElementById("pos").textContent = "Soldier " + Math.round(soldierX) + "  ·  Alien " + Math.round(alienX);
      requestAnimationFrame(frame);
    }

    buttons.outpost.addEventListener("click", () => setScene("outpost"));
    buttons.fortress.addEventListener("click", () => setScene("fortress"));
    window.addEventListener("keydown", (ev) => {
      keys.add(ev.key.toLowerCase());
      if (ev.key === "1") setScene("outpost");
      if (ev.key === "2") setScene("fortress");
    });
    window.addEventListener("keyup", (ev) => keys.delete(ev.key.toLowerCase()));

    Promise.all([
      fetch("layout.json").then((r) => r.json()),
      loadImage("outpost-bg.png"),
      loadImage("fortress-bg.png"),
    ]).then(async ([data, outpostBg, fortressBg]) => {
      layout = data;
      soldierX = params.get("x") ? Number(params.get("x")) : data.outpost.soldier.x;
      alienX = params.get("ax") ? Number(params.get("ax")) : data.fortress.alien.x;
      images["outpost-bg"] = outpostBg;
      images["fortress-bg"] = fortressBg;
      images.soldierIdle = await loadImage("../assets/" + data.outpost.soldier.idle);
      images.soldierWalk = await loadImage("../assets/" + data.outpost.soldier.walk);
      images.alienIdle = await loadImage("../assets/" + data.fortress.alien.idle);
      images.alienWalk = await loadImage("../assets/" + data.fortress.alien.walk);
      setScene(scene);
      canvas.dataset.ready = "1";
      requestAnimationFrame(frame);
    }).catch((err) => {
      hint.textContent = "Preview failed to load: " + err.message;
    });
  </script>
</body>
</html>
